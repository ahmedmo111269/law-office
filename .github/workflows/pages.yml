name: Deploy PWA to GitHub Pages

# The app is a static bundle in `dist/`. `dist/` is intentionally NOT committed:
# it is rebuilt from source on every deploy, so the published site can never
# drift from the code and no database/backup file can leak into the repository.
#
# This repository's Pages site is still configured with the legacy "deploy from
# a branch" source, so GitHub also publishes a Jekyll build of the repository
# root on every push. That build shows the README instead of the app. Until the
# owner switches Settings → Pages → Source to "GitHub Actions" (the API token
# used here cannot change it), we redeploy the artifact *after* the legacy build
# finishes so the application is the last deployment that wins.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run data-layer tests
        run: npm test

      - name: Build the web app
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Legacy Pages has its own deployment job. Waiting only for its build, or
      # racing it on push, can leave README.html as the final live deployment.
      # Keep this compatibility barrier until Pages → Source is GitHub Actions.
      - name: Wait for legacy Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pages } = await github.rest.repos.getPages({ owner, repo });
            if (pages.build_type !== 'legacy') {
              core.info('Pages uses GitHub Actions; no legacy deployment to wait for.');
              return;
            }
            core.warning('Pages still uses deploy-from-branch. Set Settings → Pages → Source to GitHub Actions.');
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : context.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, per_page: 100,
              });
              const legacy = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' && run.id !== context.runId
              );
              if (legacy.length && legacy.every(run => run.status === 'completed')) {
                core.info('Legacy Pages deployment finished; publishing the app last.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Legacy Pages did not finish within 10 minutes. Switch Pages Source to GitHub Actions and rerun this workflow.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
